name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Odisea.slnx
      - name: Build
        run: dotnet build Odisea.slnx --no-restore
      - name: Test
        run: dotnet test Odisea.slnx --no-build --verbosity normal
