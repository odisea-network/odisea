name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: odisea
          POSTGRES_PASSWORD: odisea
          POSTGRES_DB: odisea
        ports:
          # 5433 keeps parity with compose.yaml, so the default test connection string works in both places.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U odisea -d odisea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ODISEA_TEST_CONNECTION: "Host=localhost;Port=5433;Database=odisea_test;Username=odisea;Password=odisea"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Odisea.slnx
      - name: Build
        run: dotnet build Odisea.slnx --no-restore
      - name: Test
        run: dotnet test Odisea.slnx --no-build --verbosity normal

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/portal/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npx ng test
      - name: Build
        run: npx ng build
